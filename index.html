<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#102841" />
  <title>Confiauto | Territórios Serra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Confiauto — início">
        <img class="brand-logo" src="https://confiauto.online/brand/Logo-Confiauto-2024-2048x424.png" alt="Confiauto proteção veicular" />
      </a>
      <div class="topbar-divider"></div>
      <div class="page-heading"><span class="eyebrow">OPERAÇÃO COMERCIAL</span><strong>Mapa de atuação</strong></div>
      <div class="topbar-spacer"></div>
      <div class="city-pill"><span class="live-dot"></span><span>Serra, ES</span><span class="chevron">⌄</span></div>
      <button id="exportBtn" class="button button-primary export-top"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg> Exportar divisão</button>
    </header>


    <main class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-scroll">
          <div class="side-title-row"><div><div class="section-kicker">PLANEJAMENTO</div><h1>Equipes de vendas</h1></div><button class="icon-button add-team" id="addTeamBtn" title="Adicionar equipe" aria-label="Adicionar equipe">+</button></div>
          <p class="side-description">Organize os bairros e distribua a atuação de cada time.</p>


          <div class="metric-row">
            <div class="metric-card"><div class="metric-icon blue-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg></div><div><strong id="assignedCount">—</strong><span>bairros atribuídos</span></div></div>
            <div class="metric-card"><div class="metric-icon green-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.3"/><path d="M3 20v-1.5a6 6 0 0 1 12 0V20M16 5.5a3.2 3.2 0 0 1 0 6.2m2 2.1a5 5 0 0 1 3 4.6V20"/></svg></div><div><strong id="teamCount">0</strong><span>equipes ativas</span></div></div>
